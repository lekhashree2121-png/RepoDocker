<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineMagic · movie booking</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .app {
      max-width: 1200px;
      width: 100%;
      background: rgba(18, 22, 33, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: white;
      margin-bottom: 0.35rem;
    }

    h1 span {
      background: linear-gradient(135deg, #f5b042, #e86f2e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subhead {
      color: #9aa4bf;
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 400;
      border-left: 3px solid #f5b042;
      padding-left: 1rem;
    }

    /* movie grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .movie-card {
      background: #1e2436;
      border-radius: 1.5rem;
      padding: 1.2rem 1rem 1rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      border: 1px solid #2d3448;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      border-color: #f5b042;
      box-shadow: 0 15px 25px -8px #f5b04240, 0 0 0 1px #f5b04260;
    }

    .movie-card.selected {
      border: 2px solid #f5b042;
      background: #2a2f45;
      box-shadow: 0 0 0 3px #f5b04230, 0 12px 20px -8px #f5b04280;
      transform: scale(1.02);
    }

    .movie-emoji {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 0.7rem;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
    }

    .movie-title {
      font-weight: 600;
      color: white;
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
    }

    .movie-meta {
      font-size: 0.75rem;
      color: #a6b0cc;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      background: #2e354b;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      font-weight: 500;
      color: #cdd6f0;
    }

    /* showtime section */
    .section-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #ccd6f0;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    .section-label i {
      font-size: 1.2rem;
      color: #f5b042;
    }

    .showtimes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 2.2rem;
    }

    .time-btn {
      background: #1a1f30;
      border: 1px solid #2e354b;
      color: #b8c2dd;
      padding: 0.75rem 1.5rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 0 #0d101b;
      flex: 0 1 auto;
    }

    .time-btn:hover {
      background: #252c40;
      border-color: #f5b04280;
      color: white;
    }

    .time-btn.selected {
      background: #f5b042;
      border-color: #f5b042;
      color: #0b0f1c;
      box-shadow: 0 4px 0 #b87c25;
      transform: translateY(-1px);
    }

    /* seat map */
    .seat-area {
      background: #111624;
      border-radius: 2rem;
      padding: 1.8rem 1.5rem 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid #252d42;
    }

    .screen-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .screen-curve {
      width: 80%;
      height: 10px;
      background: linear-gradient(90deg, transparent, #f5b04260, #f5b042, #f5b04260, transparent);
      border-radius: 50%;
      filter: blur(4px);
      margin-bottom: 0.5rem;
    }

    .screen-label {
      color: #7e89aa;
      font-size: 0.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .seats-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
    }

    .seat-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .seat {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 0.8rem 0.8rem 0.5rem 0.5rem;
      background: #252e44;
      border: 1px solid #3b455f;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #7d8bb0;
      box-shadow: 0 3px 0 #0f121b;
      user-select: none;
    }

    .seat:not(.occupied):hover {
      background: #3c4766;
      border-color: #f5b04280;
      transform: scale(1.05);
    }

    .seat.selected {
      background: #f5b042;
      border-color: #f5b042;
      color: #0b0f1c;
      box-shadow: 0 0 10px #f5b042cc, 0 3px 0 #b87c25;
    }

    .seat.occupied {
      background: #161c2b;
      border-color: #1f2638;
      color: #3d455e;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.5;
      pointer-events: none;
    }

    .seat.aisle {
      opacity: 0.2;
      pointer-events: none;
      background: transparent;
      border: none;
      box-shadow: none;
      width: 1.2rem;
    }

    /* summary */
    .summary-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      background: #131a2b;
      border-radius: 2rem;
      padding: 1.4rem 2rem;
      border: 1px solid #2b344d;
      box-shadow: inset 0 1px 0 #ffffff08, 0 10px 20px -10px black;
    }

    .summary-info {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: center;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7e89aa;
      font-weight: 500;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
      line-height: 1.3;
    }

    .stat-value small {
      font-size: 0.8rem;
      font-weight: 400;
      color: #a6b0cc;
      margin-left: 4px;
    }

    .selected-seats-list {
      font-size: 0.9rem;
      color: #f5b042;
      font-weight: 500;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-btn {
      background: #f5b042;
      border: none;
      color: #0b0f1c;
      font-weight: 700;
      font-size: 1rem;
      padding: 1rem 2.5rem;
      border-radius: 4rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 0 #b87c25, 0 10px 25px -5px #f5b04280;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .book-btn:hover {
      background: #ffc25c;
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #b87c25, 0 15px 30px -5px #f5b042b0;
    }

    .book-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b87c25, 0 10px 20px -5px #f5b04280;
    }

    .book-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #6b552a, 0 8px 15px -5px #00000050;
      pointer-events: none;
      background: #7a6a48;
      color: #2a2a2a;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #f5b042;
      color: #0b0f1c;
      font-weight: 600;
      padding: 1rem 2.5rem;
      border-radius: 3rem;
      box-shadow: 0 15px 30px -5px black;
      transition: transform 0.3s ease;
      z-index: 999;
      font-size: 1rem;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      letter-spacing: 0.3px;
      border: 1px solid #ffda94;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* no movie / no showtime */
    .placeholder {
      color: #5b6785;
      text-align: center;
      padding: 2rem 1rem;
      font-size: 1rem;
      border: 1px dashed #2e354b;
      border-radius: 1.5rem;
      background: #11162450;
    }

    @media (max-width: 650px) {
      .app { padding: 1.5rem; }
      h1 { font-size: 1.6rem; }
      .movie-grid { grid-template-columns: repeat(2, 1fr); }
      .summary-panel { flex-direction: column; align-items: stretch; }
      .book-btn { justify-content: center; }
      .seat { width: 1.9rem; height: 1.9rem; font-size: 0.6rem; }
      .seat-row { gap: 0.4rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>
    <span>🎬 CineMagic</span>
  </h1>
  <div class="subhead">pick a movie · choose showtime · select seats</div>

  <!-- MOVIE SELECTION -->
  <div class="movie-grid" id="movieGrid"></div>

  <!-- SHOWTIME SECTION -->
  <div class="section-label">
    <i>🕒</i> Showtimes
  </div>
  <div class="showtimes" id="showtimeContainer"></div>

  <!-- SEAT MAP -->
  <div class="seat-area">
    <div class="screen-indicator">
      <div class="screen-curve"></div>
      <div class="screen-label">screen</div>
    </div>
    <div class="seats-grid" id="seatsGrid"></div>
  </div>

  <!-- SUMMARY + BOOK BUTTON -->
  <div class="summary-panel">
    <div class="summary-info">
      <div class="stat">
        <span class="stat-label">Seats</span>
        <span class="stat-value" id="seatCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="totalPrice">$0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Selected</span>
        <span class="selected-seats-list" id="selectedSeatsDisplay">—</span>
      </div>
    </div>
    <button class="book-btn" id="bookBtn" disabled>
      <span>🎟️</span> Book now
    </button>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast">✅ Booking confirmed!</div>

<script>
  (function() {
    // ---------- MOCK DATA ----------
    const movies = [
      { id: 'dune', title: 'Dune: Part Two', emoji: '🏜️', genre: 'Sci-Fi', duration: '2h 46m', basePrice: 14 },
      { id: 'oppenheimer', title: 'Oppenheimer', emoji: '⚛️', genre: 'Drama', duration: '3h 0m', basePrice: 15 },
      { id: 'barbie', title: 'Barbie', emoji: '💖', genre: 'Comedy', duration: '1h 54m', basePrice: 12 },
      { id: 'godfather', title: 'The Godfather', emoji: '🍊', genre: 'Crime', duration: '2h 55m', basePrice: 13 },
      { id: 'spiderverse', title: 'Across the Spider-Verse', emoji: '🕸️', genre: 'Animation', duration: '2h 20m', basePrice: 13 }
    ];

    // showtimes per movie (generic)
    const showtimes = ['10:30', '13:15', '16:00', '18:45', '21:30'];

    // seat layout: 8 rows (A-H) x 10 seats per row, with aisle after 2 and 7 (indexes 2 and 7 -> gap)
    const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const SEATS_PER_ROW = 10;
    // fixed occupied seats pattern for realism (varies per movie+showtime)
    // we'll generate occupied based on movie & showtime

    // ---------- STATE ----------
    let selectedMovieId = movies[0].id;          // default first movie
    let selectedShowtime = showtimes[0];         // default first showtime
    // selected seats: Set of strings like "A-3", "B-5"
    let selectedSeats = new Set();

    // ---------- DOM refs ----------
    const movieGrid = document.getElementById('movieGrid');
    const showtimeContainer = document.getElementById('showtimeContainer');
    const seatsGrid = document.getElementById('seatsGrid');
    const seatCountEl = document.getElementById('seatCount');
    const totalPriceEl = document.getElementById('totalPrice');
    const selectedSeatsDisplay = document.getElementById('selectedSeatsDisplay');
    const bookBtn = document.getElementById('bookBtn');
    const toast = document.getElementById('toast');

    // ---------- HELPER FUNCTIONS ----------
    function getMovieById(id) {
      return movies.find(m => m.id === id) || movies[0];
    }

    // generate deterministic occupied seats for a movie+showtime (so it stays same)
    function getOccupiedSeats(movieId, showtime) {
      // use a simple hash to vary per combination
      const seed = (movieId + showtime).split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      const occupied = new Set();
      const totalSeats = ROWS.length * SEATS_PER_ROW;
      // occupy ~20-30% of seats deterministically
      for (let i = 0; i < totalSeats; i++) {
        const pseudoRandom = (seed * (i + 1) * 9301 + 49297) % 233280;
        const rnd = pseudoRandom / 233280;
        if (rnd < 0.23) { // ~23% occupied
          const rowIndex = Math.floor(i / SEATS_PER_ROW);
          const seatIndex = i % SEATS_PER_ROW;
          const rowLetter = ROWS[rowIndex];
          occupied.add(`${rowLetter}-${seatIndex + 1}`);
        }
      }
      return occupied;
    }

    // calculate price per seat (base + row premium)
    function getSeatPrice(movieId, rowLetter) {
      const movie = getMovieById(movieId);
      let premium = 0;
      if (rowLetter === 'A' || rowLetter === 'B') premium = 4;       // front rows cheaper? maybe expensive? we make them premium
      else if (rowLetter === 'G' || rowLetter === 'H') premium = 3;  // back rows premium
      else if (rowLetter === 'C' || rowLetter === 'D') premium = 1;
      // E, F standard
      return movie.basePrice + premium;
    }

    // total price for selected seats
    function calculateTotal() {
      let total = 0;
      selectedSeats.forEach(seatKey => {
        const [row] = seatKey.split('-');
        total += getSeatPrice(selectedMovieId, row);
      });
      return total;
    }

    // update summary UI
    function updateSummary() {
      const count = selectedSeats.size;
      seatCountEl.textContent = count;
      const total = calculateTotal();
      totalPriceEl.textContent = `$${total}`;
      
      if (count === 0) {
        selectedSeatsDisplay.textContent = '—';
      } else {
        const sorted = Array.from(selectedSeats).sort((a, b) => {
          const [rowA, numA] = a.split('-');
          const [rowB, numB] = b.split('-');
          if (rowA !== rowB) return rowA.localeCompare(rowB);
          return parseInt(numA) - parseInt(numB);
        });
        selectedSeatsDisplay.textContent = sorted.join(', ');
      }
      
      bookBtn.disabled = (count === 0);
    }

    // clear selected seats (when movie/showtime changes)
    function clearSelectedSeats() {
      selectedSeats.clear();
    }

    // ---------- RENDER MOVIES ----------
    function renderMovies() {
      movieGrid.innerHTML = movies.map(movie => {
        const selectedClass = movie.id === selectedMovieId ? 'selected' : '';
        return `
          <div class="movie-card ${selectedClass}" data-movie-id="${movie.id}">
            <div class="movie-emoji">${movie.emoji}</div>
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta">
              <span class="badge">${movie.genre}</span>
              <span class="badge">${movie.duration}</span>
            </div>
          </div>
        `;
      }).join('');

      // attach click listeners
      document.querySelectorAll('.movie-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const movieId = card.dataset.movieId;
          if (movieId === selectedMovieId) return;
          selectedMovieId = movieId;
          // reset showtime to first for simplicity
          selectedShowtime = showtimes[0];
          clearSelectedSeats();
          renderMovies();        // re-render to update selected class
          renderShowtimes();
          renderSeats();
          updateSummary();
        });
      });
    }

    // ---------- RENDER SHOWTIMES ----------
    function renderShowtimes() {
      showtimeContainer.innerHTML = showtimes.map(time => {
        const selectedClass = time === selectedShowtime ? 'selected' : '';
        return `<button class="time-btn ${selectedClass}" data-time="${time}">${time}</button>`;
      }).join('');

      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const time = btn.dataset.time;
          if (time === selectedShowtime) return;
          selectedShowtime = time;
          clearSelectedSeats();
          renderShowtimes();
          renderSeats();
          updateSummary();
        });
      });
    }

    // ---------- RENDER SEATS ----------
    function renderSeats() {
      const occupiedSeats = getOccupiedSeats(selectedMovieId, selectedShowtime);
      let html = '';

      ROWS.forEach((row, rowIdx) => {
        html += `<div class="seat-row">`;
        for (let seatNum = 1; seatNum <= SEATS_PER_ROW; seatNum++) {
          // add aisle after seat 2 and after seat 7 (visual gap)
          if (seatNum === 3 || seatNum === 8) {
            html += `<div class="seat aisle"></div>`;
          }
          const seatKey = `${row}-${seatNum}`;
          const isOccupied = occupiedSeats.has(seatKey);
          const isSelected = selectedSeats.has(seatKey);
          
          let seatClass = 'seat';
          if (isOccupied) seatClass += ' occupied';
          if (isSelected) seatClass += ' selected';

          // show seat number inside (if not occupied, to keep clean we show number, for occupied we show ✕ maybe)
          const seatLabel = isOccupied ? '✕' : seatNum;
          
          html += `<div class="${seatClass}" data-seat-key="${seatKey}" data-row="${row}" data-seat-num="${seatNum}">${seatLabel}</div>`;
        }
        html += `</div>`;
      });

      // add row labels? we can add small labels at left, but fine.
      seatsGrid.innerHTML = html;

      // attach click listeners to non-occupied seats
      document.querySelectorAll('.seat:not(.occupied):not(.aisle)').forEach(seatEl => {
        seatEl.addEventListener('click', (e) => {
          const seatKey = seatEl.dataset.seatKey;
          if (!seatKey) return;
          // toggle selection
          if (selectedSeats.has(seatKey)) {
            selectedSeats.delete(seatKey);
          } else {
            selectedSeats.add(seatKey);
          }
          // re-render only that seat's class? simpler: re-render all seats to keep consistent but we need to re-attach listeners.
          // For simplicity we re-render whole seats (performance is fine)
          renderSeats();
          updateSummary();
        });
      });
    }

    // ---------- BOOKING ----------
    function handleBooking() {
      if (selectedSeats.size === 0) return;
      
      const movie = getMovieById(selectedMovieId);
      const seatsArray = Array.from(selectedSeats).sort();
      const total = calculateTotal();
      
      // show toast with fancy message
      toast.innerHTML = `✅ ${selectedSeats.size} seat${selectedSeats.size > 1 ? 's' : ''} booked · ${movie.title} at ${selectedShowtime} · $${total}`;
      toast.classList.add('show');
      
      // clear selection after booking
      clearSelectedSeats();
      // also update occupied seats? we could mark these as occupied now, but simpler to just refresh with new occupied (simulate randomness)
      // Let's simulate that the booked seats become occupied for the next render, but we need to keep it deterministic? 
      // To keep deterministic we won't add them to occupied. Just refresh.
      renderSeats();
      updateSummary();

      // hide toast after 3 sec
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // ---------- INITIAL RENDER ----------
    function init() {
      // by default no seats selected
      clearSelectedSeats();
      renderMovies();
      renderShowtimes();
      renderSeats();
      updateSummary();

      // book button event
      bookBtn.addEventListener('click', handleBooking);
    }

    init();
  })();
</script>
</body>
</html>
